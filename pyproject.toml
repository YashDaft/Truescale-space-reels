[project]
name = "truescale"
version = "0.1.0"
description = "Space reels where every number is checked against official sources"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factsheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
